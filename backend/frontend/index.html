<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friendi.fi Invoicing & Reconciliation Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and ReactDOM CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- Babel CDN to compile JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            background-color: #f8fafc;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function StatementNode({ node, depth = 0 }) {
            const [collapsed, setCollapsed] = useState(node.collapsed);

            const toggleCollapsed = () => setCollapsed(!collapsed);

            const roleStyles = {
                header: "text-slate-800 font-bold text-lg border-b pb-2 mb-4",
                issued_amount: "text-slate-600 flex justify-between my-2 text-sm",
                amount_due: "text-emerald-800 font-extrabold text-lg border-t-2 border-slate-800 pt-3 mt-4 flex justify-between",
                run: "text-indigo-700 flex justify-between my-2 text-sm italic font-semibold",
                line: "text-slate-700 flex justify-between my-2 text-sm",
                correction: "text-amber-700 flex justify-between my-1 text-xs pl-4 border-l-2 border-amber-200",
                pending: "text-rose-600 flex justify-between my-1 text-xs pl-4 border-l-2 border-rose-200",
                settlement: "text-slate-500 text-xs pl-6 italic",
            };

            const isGroup = node.role === "group";

            return (
                <div className="mb-2">
                    {isGroup ? (
                        <div className="border border-slate-100 rounded bg-slate-50/50 p-3 my-3">
                            <button 
                                onClick={toggleCollapsed}
                                className="flex items-center justify-between w-full text-slate-700 font-bold text-sm hover:text-slate-900 focus:outline-none"
                            >
                                <span>{node.label}</span>
                                <span className="text-xs text-slate-400">
                                    {collapsed ? "[expand]" : "[collapse]"}
                                </span>
                            </button>
                            {!collapsed && (
                                <div className="mt-3 pl-2 border-l border-slate-200 space-y-2">
                                    {node.children.map((c, i) => (
                                        <StatementNode key={c.label + c.role + i} node={c} depth={depth + 1} />
                                    ))}
                                </div>
                            )}
                        </div>
                    ) : (
                        <div className={roleStyles[node.role] || "text-slate-700 text-sm"}>
                            <div className="flex justify-between w-full">
                                <span>{node.label}</span>
                                {node.value !== null && (
                                    <span className="font-mono">{node.value}</span>
                                )}
                            </div>
                            {node.children && node.children.length > 0 && (
                                <div className="w-full mt-1">
                                    {node.children.map((c, i) => (
                                        <StatementNode key={c.label + c.role + i} node={c} depth={depth + 1} />
                                    ))}
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        function App() {
            const [account, setAccount] = useState(null);
            const [statementTree, setStatementTree] = useState(null);
            const [selectedPeriod, setSelectedPeriod] = useState("2026-06");
            const [viewport, setViewport] = useState("phone");
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);

            // Form states for delivery
            const [adjId, setAdjId] = useState("");
            const [adjKind, setAdjKind] = useState("credit");
            const [adjAmount, setAdjAmount] = useState("");
            const [adjUsageKey, setAdjUsageKey] = useState("api");
            const [adjQuantity, setAdjQuantity] = useState("");
            const [adjTargetPeriod, setAdjTargetPeriod] = useState("");
            const [adjWithdrawsId, setAdjWithdrawsId] = useState("");
            const [adjReplacesId, setAdjReplacesId] = useState("");
            const [adjSubjectKey, setAdjSubjectKey] = useState("");

            // Form states for Run and Adoption
            const [runOpId, setRunOpId] = useState("");
            const [adoptId, setAdoptId] = useState("");

            // Notification / Alert states
            const [alertMsg, setAlertMsg] = useState(null);
            const [alertType, setAlertType] = useState("success");

            const fetchAccountData = async () => {
                try {
                    const res = await fetch("/api/account/");
                    if (!res.ok) throw new Error("Failed to fetch account ledger data");
                    const data = await res.json();
                    setAccount(data);
                } catch (err) {
                    setError(err.message);
                }
            };

            const fetchStatementTree = async () => {
                try {
                    const res = await fetch(`/api/statement/${selectedPeriod}/?viewport=${viewport}`);
                    if (!res.ok) throw new Error("Failed to fetch statement tree");
                    const data = await res.json();
                    setStatementTree(data);
                } catch (err) {
                    console.error(err);
                }
            };

            useEffect(() => {
                setLoading(true);
                Promise.all([fetchAccountData(), fetchStatementTree()]).finally(() => {
                    setLoading(false);
                });
            }, []);

            useEffect(() => {
                if (account) {
                    fetchStatementTree();
                }
            }, [selectedPeriod, viewport]);

            const showAlert = (msg, type = "success") => {
                setAlertMsg(msg);
                setAlertType(type);
                setTimeout(() => setAlertMsg(null), 5000);
            };

            const handleDeliver = async (e) => {
                e.preventDefault();
                if (!adjId) {
                    showAlert("Adjustment ID is required", "error");
                    return;
                }
                const payload = {
                    adjustment_id: adjId,
                    period_key: selectedPeriod,
                    kind: adjKind,
                    effective_at: new Date().toISOString(),
                    received_at: new Date().toISOString(),
                };

                if (adjKind === "credit" && adjAmount) payload.amount = adjAmount;
                if (adjKind === "usage_correction") {
                    payload.usage_key = adjUsageKey;
                    payload.quantity = adjQuantity;
                }
                if (adjKind === "usage_transfer") {
                    payload.usage_key = adjUsageKey;
                    payload.quantity = adjQuantity;
                    payload.target_period_key = adjTargetPeriod;
                }
                if (adjKind === "withdrawal") {
                    payload.withdraws_adjustment_id = adjWithdrawsId;
                }
                if (adjReplacesId) payload.replaces_adjustment_id = adjReplacesId;
                if (adjSubjectKey) payload.subject_key = adjSubjectKey;

                try {
                    const res = await fetch("/api/deliver/", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });
                    const data = await res.json();
                    if (data.error) {
                        showAlert(data.error, "error");
                    } else {
                        showAlert(data.record ? `Adjustment accepted! Record ID: ${data.record.record_id}` : "Adjustment processed (collapsed retry/duplicate).");
                        setAccount(data.account);
                        fetchStatementTree();
                        // Reset form
                        setAdjId("");
                        setAdjAmount("");
                        setAdjQuantity("");
                        setAdjWithdrawsId("");
                        setAdjReplacesId("");
                        setAdjSubjectKey("");
                    }
                } catch (err) {
                    showAlert(err.message, "error");
                }
            };

            const handleIssueRun = async (e) => {
                e.preventDefault();
                if (!runOpId) {
                    showAlert("Operation ID is required", "error");
                    return;
                }
                try {
                    const res = await fetch("/api/run/", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ operation_id: runOpId })
                    });
                    const data = await res.json();
                    if (data.error) {
                        showAlert(data.error, "error");
                    } else {
                        showAlert(`Statement run ${data.run.run_id} issued successfully!`);
                        setAccount(data.account);
                        fetchStatementTree();
                        setRunOpId("");
                    }
                } catch (err) {
                    showAlert(err.message, "error");
                }
            };

            const handleAdoptSummaries = async (e) => {
                e.preventDefault();
                if (!adoptId) {
                    showAlert("Adoption ID is required", "error");
                    return;
                }
                try {
                    const res = await fetch("/api/adopt/", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ adoption_id: adoptId })
                    });
                    const data = await res.json();
                    if (data.error) {
                        showAlert(data.error, "error");
                    } else {
                        showAlert(`Reconciliation summaries successfully adopted!`);
                        setAccount(data.account);
                        fetchStatementTree();
                        setAdoptId("");
                    }
                } catch (err) {
                    showAlert(err.message, "error");
                }
            };

            const handleReset = async () => {
                if (confirm("Are you sure you want to reset the account to its initial state?")) {
                    try {
                        const res = await fetch("/api/reset/", { method: "POST" });
                        const data = await res.json();
                        setAccount(data.account);
                        fetchStatementTree();
                        showAlert("Account reset successful.");
                    } catch (err) {
                        showAlert(err.message, "error");
                    }
                }
            };

            if (error) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-red-50 text-red-800 p-6">
                        <div className="max-w-md bg-white p-8 rounded-lg shadow-md border border-red-200">
                            <h1 className="text-2xl font-bold mb-4">Error Loading Dashboard</h1>
                            <p>{error}</p>
                            <button onClick={() => location.reload()} className="mt-6 px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700">Retry</button>
                        </div>
                    </div>
                );
            }

            if (loading || !account) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-50 text-slate-600">
                        <div className="text-center">
                            <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-slate-800 mx-auto mb-4"></div>
                            <p className="text-lg">Spinning up Gordon's Billing Agent...</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col font-sans">
                    {/* Header */}
                    <header className="bg-slate-900 text-white py-4 px-6 shadow-md flex justify-between items-center">
                        <div className="flex items-center space-x-3">
                            <div className="bg-emerald-500 p-2 rounded-lg">
                                <svg className="w-6 h-6 text-slate-900" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                            </div>
                            <div>
                                <h1 className="text-xl font-bold tracking-tight">Friendi.fi Invoicing</h1>
                                <p className="text-xs text-slate-400">Gordon's Reconciliation Engine v1.3</p>
                            </div>
                        </div>
                        <div className="flex items-center space-x-4">
                            <button 
                                onClick={handleReset}
                                className="px-3 py-1.5 bg-slate-800 border border-slate-700 rounded text-xs hover:bg-slate-700 transition"
                            >
                                Reset Demo
                            </button>
                            <span className="text-xs bg-emerald-500/20 text-emerald-400 px-2 py-1 rounded font-semibold">
                                Connected
                            </span>
                        </div>
                    </header>

                    {/* Alert Banner */}
                    {alertMsg && (
                        <div className={`py-3 px-6 text-sm font-semibold flex justify-between items-center shadow-inner transition-all ${alertType === 'error' ? 'bg-rose-100 text-rose-800' : 'bg-emerald-100 text-emerald-800'}`}>
                            <span>{alertMsg}</span>
                            <button onClick={() => setAlertMsg(null)} className="text-xs hover:underline">Dismiss</button>
                        </div>
                    )}

                    {/* Main Content */}
                    <main className="flex-1 max-w-7xl w-full mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
                        
                        {/* Column 1: Account Overview & Delivery Form */}
                        <div className="space-y-6 lg:col-span-1">
                            
                            {/* Account Overview Card */}
                            <div className="bg-white p-6 rounded-lg shadow-sm border border-slate-100">
                                <h2 className="text-sm font-bold uppercase tracking-wider text-slate-400 mb-4">Account Overview</h2>
                                <div className="grid grid-cols-2 gap-4">
                                    <div className="bg-slate-50 p-4 rounded">
                                        <p className="text-xs text-slate-500 mb-1">Billing Balance</p>
                                        <p className="text-2xl font-mono font-bold text-slate-800">${account.balance}</p>
                                    </div>
                                    <div className="bg-slate-50 p-4 rounded">
                                        <p className="text-xs text-slate-500 mb-1">Amount Due</p>
                                        <p className="text-2xl font-mono font-bold text-emerald-700">${account.amount_due}</p>
                                    </div>
                                </div>
                                <div className="mt-4 pt-4 border-t border-slate-100 flex justify-between text-xs">
                                    <span className="text-slate-500">Settlement Policy:</span>
                                    <span className="font-semibold text-slate-700 uppercase">{account.settlement_policy}</span>
                                </div>
                                <div className="mt-2 flex justify-between text-xs">
                                    <span className="text-slate-500">Adoption Status:</span>
                                    {account.summaries_adopted_id ? (
                                        <span className="font-semibold text-indigo-600">Adopted (Ord {account.summaries_adopted_ordinal})</span>
                                    ) : (
                                        <span className="text-slate-400 italic">Not Adopted</span>
                                    )}
                                </div>
                            </div>

                            {/* Adjustment Delivery Form */}
                            <div className="bg-white p-6 rounded-lg shadow-sm border border-slate-100">
                                <h2 className="text-md font-bold text-slate-800 mb-4">Deliver Business Correction</h2>
                                <form onSubmit={handleDeliver} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">Adjustment ID</label>
                                        <input 
                                            type="text" 
                                            value={adjId} 
                                            onChange={e => setAdjId(e.target.value)}
                                            placeholder="e.g. adj-101" 
                                            className="w-full text-sm font-mono border border-slate-200 rounded p-2 focus:ring-1 focus:ring-emerald-500 outline-none"
                                        />
                                    </div>
                                    
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">Correction Kind</label>
                                        <select 
                                            value={adjKind} 
                                            onChange={e => setAdjKind(e.target.value)}
                                            className="w-full text-sm border border-slate-200 rounded p-2 focus:ring-1 focus:ring-emerald-500 outline-none"
                                        >
                                            <option value="credit">Credit</option>
                                            <option value="usage_correction">Usage Correction</option>
                                            <option value="usage_transfer">Usage Transfer</option>
                                            <option value="withdrawal">Withdrawal (Reversal)</option>
                                        </select>
                                    </div>

                                    {adjKind === "credit" && (
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 mb-1">Amount ($)</label>
                                            <input 
                                                type="number" 
                                                step="0.01"
                                                value={adjAmount} 
                                                onChange={e => setAdjAmount(e.target.value)}
                                                placeholder="e.g. 5.00" 
                                                className="w-full text-sm font-mono border border-slate-200 rounded p-2 focus:ring-1 focus:ring-emerald-500 outline-none"
                                            />
                                        </div>
                                    )}

                                    {(adjKind === "usage_correction" || adjKind === "usage_transfer") && (
                                        <div className="grid grid-cols-2 gap-3">
                                            <div>
                                                <label className="block text-xs font-bold text-slate-500 mb-1">Usage Key</label>
                                                <input 
                                                    type="text" 
                                                    value={adjUsageKey} 
                                                    onChange={e => setAdjUsageKey(e.target.value)}
                                                    placeholder="e.g. api" 
                                                    className="w-full text-sm border border-slate-200 rounded p-2 focus:ring-1 focus:ring-emerald-500 outline-none"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-bold text-slate-500 mb-1">Quantity</label>
                                                <input 
                                                    type="number" 
                                                    step="0.01"
                                                    value={adjQuantity} 
                                                    onChange={e => setAdjQuantity(e.target.value)}
                                                    placeholder="e.g. 15" 
                                                    className="w-full text-sm font-mono border border-slate-200 rounded p-2 focus:ring-1 focus:ring-emerald-500 outline-none"
                                                />
                                            </div>
                                        </div>
                                    )}

                                    {adjKind === "usage_transfer" && (
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 mb-1">Target Period Key</label>
                                            <input 
                                                type="text" 
                                                value={adjTargetPeriod} 
                                                onChange={e => setAdjTargetPeriod(e.target.value)}
                                                placeholder="e.g. 2026-07" 
                                                className="w-full text-sm border border-slate-200 rounded p-2 focus:ring-1 focus:ring-emerald-500 outline-none"
                                            />
                                        </div>
                                    )}

                                    {adjKind === "withdrawal" && (
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 mb-1">Withdraws Adjustment ID</label>
                                            <input 
                                                type="text" 
                                                value={adjWithdrawsId} 
                                                onChange={e => setAdjWithdrawsId(e.target.value)}
                                                placeholder="e.g. adj-1" 
                                                className="w-full text-sm font-mono border border-slate-200 rounded p-2 focus:ring-1 focus:ring-emerald-500 outline-none"
                                            />
                                        </div>
                                    )}

                                    <div className="border-t border-slate-100 pt-3 space-y-3">
                                        <div className="grid grid-cols-2 gap-3">
                                            <div>
                                                <label className="block text-xs font-bold text-slate-400 mb-1">Replaces ID (Optional)</label>
                                                <input 
                                                    type="text" 
                                                    value={adjReplacesId} 
                                                    onChange={e => setAdjReplacesId(e.target.value)}
                                                    placeholder="e.g. adj-old" 
                                                    className="w-full text-xs font-mono border border-slate-200 rounded p-1.5 outline-none"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-bold text-slate-400 mb-1">Subject Key (Optional)</label>
                                                <input 
                                                    type="text" 
                                                    value={adjSubjectKey} 
                                                    onChange={e => setAdjSubjectKey(e.target.value)}
                                                    placeholder="e.g. sub-1" 
                                                    className="w-full text-xs font-mono border border-slate-200 rounded p-1.5 outline-none"
                                                />
                                            </div>
                                        </div>
                                    </div>

                                    <button 
                                        type="submit" 
                                        className="w-full py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded font-semibold text-sm transition"
                                    >
                                        Deliver Adjustment
                                    </button>
                                </form>
                            </div>

                        </div>

                        {/* Column 2: Calm Statement View */}
                        <div className="space-y-6 lg:col-span-1">
                            
                            <div className="bg-white p-6 rounded-lg shadow-sm border border-slate-100">
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="text-md font-bold text-slate-800">Calm Statement View</h2>
                                    <div className="flex space-x-2">
                                        <button 
                                            onClick={() => setViewport("phone")}
                                            className={`px-2 py-1 text-xs rounded border ${viewport === 'phone' ? 'bg-slate-800 text-white border-slate-800' : 'bg-white text-slate-600 border-slate-200'}`}
                                        >
                                            Phone
                                        </button>
                                        <button 
                                            onClick={() => setViewport("tablet")}
                                            className={`px-2 py-1 text-xs rounded border ${viewport === 'tablet' ? 'bg-slate-800 text-white border-slate-800' : 'bg-white text-slate-600 border-slate-200'}`}
                                        >
                                            Tablet
                                        </button>
                                    </div>
                                </div>

                                <div className="flex items-center space-x-3 mb-4">
                                    <label className="text-xs font-bold text-slate-500">Period:</label>
                                    <select 
                                        value={selectedPeriod} 
                                        onChange={e => setSelectedPeriod(e.target.value)}
                                        className="text-sm border border-slate-200 rounded p-1.5 outline-none"
                                    >
                                        {Object.keys(account.invoices).map(k => (
                                            <option key={k} value={k}>{k}</option>
                                        ))}
                                    </select>
                                    <a 
                                        href={`/api/statement/${selectedPeriod}/?format=html&viewport=${viewport}`}
                                        target="_blank"
                                        className="text-xs text-indigo-600 hover:underline flex items-center"
                                    >
                                        View HTML Statement
                                    </a>
                                </div>

                                {/* Render Statement Node Tree */}
                                {statementTree ? (
                                    <div className={`border border-slate-200 p-4 rounded bg-white overflow-x-auto ${viewport === 'phone' ? 'max-w-[320px]' : 'max-w-full'}`}>
                                        <StatementNode node={statementTree} />
                                    </div>
                                ) : (
                                    <p className="text-sm text-slate-400 italic">No statement available.</p>
                                )}
                            </div>

                        </div>

                        {/* Column 3: Runs & Reconciliation Summaries */}
                        <div className="space-y-6 lg:col-span-1">
                            
                            {/* Statement Run Control */}
                            <div className="bg-white p-6 rounded-lg shadow-sm border border-slate-100">
                                <h2 className="text-md font-bold text-slate-800 mb-4">Issue Statement Run</h2>
                                <form onSubmit={handleIssueRun} className="space-y-3">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">Operation ID</label>
                                        <input 
                                            type="text" 
                                            value={runOpId} 
                                            onChange={e => setRunOpId(e.target.value)}
                                            placeholder="e.g. run-op-abc" 
                                            className="w-full text-sm font-mono border border-slate-200 rounded p-2 focus:ring-1 focus:ring-indigo-500 outline-none"
                                        />
                                    </div>
                                    <button 
                                        type="submit" 
                                        className="w-full py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded font-semibold text-sm transition"
                                    >
                                        Issue Run
                                    </button>
                                </form>

                                {!account.summaries_adopted_id && (
                                    <div className="mt-6 pt-6 border-t border-slate-100">
                                        <h3 className="text-sm font-bold text-slate-800 mb-3">Adopt Reconciliation Summaries</h3>
                                        <form onSubmit={handleAdoptSummaries} className="space-y-3">
                                            <div>
                                                <label className="block text-xs font-bold text-slate-500 mb-1">Adoption Event ID</label>
                                                <input 
                                                    type="text" 
                                                    value={adoptId} 
                                                    onChange={e => setAdoptId(e.target.value)}
                                                    placeholder="e.g. adopt-101" 
                                                    className="w-full text-sm font-mono border border-slate-200 rounded p-2 focus:ring-1 focus:ring-indigo-500 outline-none"
                                                />
                                            </div>
                                            <button 
                                                type="submit" 
                                                className="w-full py-2 bg-slate-800 hover:bg-slate-900 text-white rounded font-semibold text-sm transition"
                                            >
                                                Adopt & Migrate
                                            </button>
                                        </form>
                                    </div>
                                )}
                            </div>

                            {/* Statement Runs History */}
                            <div className="bg-white p-6 rounded-lg shadow-sm border border-slate-100">
                                <h2 className="text-md font-bold text-slate-800 mb-4">Statement Runs History</h2>
                                {account.statement_runs.length === 0 ? (
                                    <p className="text-sm text-slate-400 italic">No statement runs have been issued yet.</p>
                                ) : (
                                    <div className="space-y-4">
                                        {account.statement_runs.map(run => (
                                            <div key={run.run_id} className="border border-slate-100 rounded p-3 bg-slate-50/50">
                                                <div className="flex justify-between items-center mb-2">
                                                    <span className="font-bold text-slate-800 text-sm">{run.run_id}</span>
                                                    <span className="text-xs px-2 py-0.5 bg-indigo-100 text-indigo-800 rounded font-semibold">
                                                        Run #{run.run_number}
                                                    </span>
                                                </div>
                                                <div className="text-xs text-slate-500 space-y-1">
                                                    <div><span className="font-semibold text-slate-600">Recorded Demand:</span> <span className="font-mono">${run.recorded_demand}</span></div>
                                                    <div><span className="font-semibold text-slate-600">Incremental Demand:</span> <span className="font-mono">${run.incremental_demand}</span></div>
                                                    <div><span className="font-semibold text-slate-600">Cutoff Ordinal:</span> <span className="font-mono">{run.cutoff_ordinal}</span></div>
                                                </div>

                                                {/* Summary Entry Preview */}
                                                {run.reconciliation_summary && (
                                                    <div className="mt-3 pt-3 border-t border-slate-200/60">
                                                        <span className="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-2">Reconciliation Summary</span>
                                                        {run.reconciliation_summary.length === 0 ? (
                                                            <span className="text-xs text-slate-400 italic">Empty run (no members)</span>
                                                        ) : (
                                                            <div className="space-y-1.5">
                                                                {run.reconciliation_summary.map(s => (
                                                                    <div key={s.invoice_id} className="flex justify-between text-xs bg-white border border-slate-100 p-1.5 rounded">
                                                                        <span className="font-semibold text-slate-600">{s.invoice_id} ({s.member_count} items)</span>
                                                                        <span className="font-mono font-bold text-slate-700">${s.member_delta_total}</span>
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        )}
                                                    </div>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>

                        </div>

                    </main>

                    {/* Footer */}
                    <footer className="bg-slate-900 text-slate-500 text-xs text-center py-4 border-t border-slate-800">
                        <p>Friendi.fi Invoicing Challenge © 2026. All rights reserved.</p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
